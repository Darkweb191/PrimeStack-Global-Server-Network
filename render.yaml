# PrimeStack Global Server Network — single-service Render blueprint.
#
# One web service hosts the entire platform:
#   • the operator console on Render's public PORT
#   • the Fastify API internally on API_PORT (proxied by the console)
services:
  - type: web
    name: primestack-platform
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push --skip-generate && npx tsx prisma/seed.ts && npm run build
    startCommand: node start-platform.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render assigns PORT; the API listens internally on API_PORT.
      - key: API_PORT
        value: 8081
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: APP_NAME
        value: primestack-global-server-network

      # ── Data stores ───────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: primestack-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://red-dbm99e2jnfac738q7rm0:6379

      # ── Auth / signing ────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: COOKIE_SECURE
        value: "true"
      - key: HMAC_ALGORITHM
        value: sha256
      - key: HMAC_HEADER_PREFIX
        value: x-primestack
      # Console operator key — the seed writes this key so the console can sign
      # its proxied API calls.
      - key: CONSOLE_HMAC_KEY_ID
        value: psk_console_001
      - key: CONSOLE_HMAC_SECRET
        generateValue: true

      # ── Limits / i18n ─────────────────────────────
      - key: RATE_LIMIT_MAX
        value: 1000
      - key: RATE_LIMIT_WINDOW
        value: 60
      - key: DEFAULT_LANGUAGE
        value: en
      - key: SUPPORTED_LANGUAGES
        value: en,fr,es,ar,pt

      # ── Secrets / integrations ────────────────────
      - key: S2S_SECRET_KEY
        generateValue: true
      - key: BANK_DETAILS_ENCRYPTION_KEY
        generateValue: true
      - key: BANK_IN2_ACCOUNT_HOLDER
        value: M/S.UNITED SOLAR AND WIND POWER TECHNOLOGIES
      - key: BANK_IN2_BANK_NAME
        value: ICICI Bank
      - key: BANK_IN2_CURRENCY
        value: INR
      - key: BANK_IN2_COUNTRY
        value: IN
      - key: BANK_IN2_GATEWAY
        value: ICICI_EAZYPAY
      - key: BANK_IN2_SWIFT_BIC
        value: ICICINBBCTS

      # ── Wise rails (fiat receiving + virtual IBANs) ───
      # Fill the three secrets in the Render dashboard — they are not stored
      # in this blueprint. Without them the rails service stays in simulation.
      - key: WISE_ENV
        value: live
      - key: WISE_API_KEY
        sync: false
      - key: WISE_PROFILE_ID
        sync: false
      - key: WISE_WEBHOOK_SECRET
        sync: false
      - key: RAILS_PORT
        value: 8082
      - key: RAILS_PAYOUT_DELAY_MS
        value: 0

  # Static documentation site — unchanged, served from ./docs.
  - type: static
    name: primestack-website
    branch: main
    staticPublishPath: ./docs
    buildCommand: echo done
    pullRequestPreviewsEnabled: false

databases:
  - name: primestack-postgres
    databaseName: primestack
    user: primestack
    plan: free
    region: oregon

