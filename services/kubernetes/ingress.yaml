apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: primestack-api
  namespace: primestack
spec:
  ingressClassName: REPLACE_WITH_INGRESS_CLASS
  tls:
    - hosts:
        - api.primestack.example
      secretName: primestack-api-tls
  rules:
    - host: api.primestack.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
