apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
  namespace: primestack
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-service
    spec:
      serviceAccountName: primestack-workload
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ledger-service
          image: primestack/ledger-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4001
          envFrom:
            - configMapRef:
                name: primestack-runtime
          env:
            - name: PORT
              value: "4001"
            - name: PGDATABASE
              value: primestack_ledger
            - name: PGUSER
              value: ledger_svc
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: primestack-runtime-secrets
                  key: ledger-db-password
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
